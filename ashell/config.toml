[animations]
enabled = true

[modules]
left = [ "Workspaces" ] 
center = [ "WindowTitle","Privacy" ]
right = [ "SystemInfo", [ "Tempo", "Privacy", "Settings","Notifications" ], "Tray"]

[window_title]
mode = "Title"
truncate_title_after_length = 100

[appearance]
font_name = "Terminess Nerd Font"
#style = "Islands"
#opacity = 0.8
#surface = "Transparent"

[appearance.opacity]
menu=0.3

[appearance.background_color]
base="#000000"
weakest = "#00267A"
weaker = "#1c1c2c"
weak = "#313244"
neutral = "#3a3a50"
strong = "#45475a"
stronger = "#505268"
strongest = "#5a5c76"
text = "#cdd6f4"
