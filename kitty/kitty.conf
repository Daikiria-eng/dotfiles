enable_audio_bell no
font_family 0xProtoNerdFont
disable_ligatures never
# url_color #61afef
url_style curly
shell zsh

background_opacity 0.75

font_size 9.1

tab_bar_edge bottom
tab_bar_style powerline
# active_tab_background #ffffff
# active_tab_foreground #000000
# inactive_tab_background #000000
# inactive_tab_foreground #ffffff

bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait 1.0
detect_urls yes
cursor_shape block
# cursor #5518C5
# cursor_text_color #5518C5
shell_integration no-cursor
# selection_background #5518C5
# selection_foreground #000000
remember_window_size  no

map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

map alt+shift+e launch --location=vsplit --cwd=current
map alt+shift+o launch --location=hsplit --cwd=current

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

map alt+shift+left resize_window wider
map alt+shift+down resize_window shorter
map alt+shift+up resize_window taller
map alt+shift+right resize_window narrower

map ctrl+plus change_font_size all +0.5
map ctrl+minus change_font_size all -0.5
map ctrl+0 change_font_size all 0

map ctrl+l send_text normal printf \'\\033[2J\\033[3J\\033[1;1H\'\x0d

repaint_delay 10
input_delay 3
sync_to_monitor yes

enabled_layouts splits:split_axis=horizontal


# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME
